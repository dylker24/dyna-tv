plugins { id 'com.android.application' }
android {
    namespace 'tv.dyna.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.dyna.launcher'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        release { storeFile file('../dyna.keystore'); storePassword 'dynatv2026'; keyAlias 'dyna'; keyPassword 'dynatv2026' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
