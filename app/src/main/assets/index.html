<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dyna TV</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:500;src:url(fonts/space-grotesk-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:700;src:url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}
:root{--bg:#0E1512;--card:#151F1A;--card2:#1F2D25;--line:#26352D;--line2:#3D5145;--text:#EFE8DA;--soft:#BDBFAE;--mute:#A9AE9F;--dim:#8F9A8C;--green:#9CCB8F}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;-webkit-user-select:none;user-select:none}
.g{font-family:"Space Grotesk",sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:52px 96px;display:flex;flex-direction:column;gap:36px;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;height:56px;flex:none}
.brand{display:flex;align-items:center;gap:16px}
.brand b{font-weight:700;font-size:34px;letter-spacing:.34em}
.brand i{font-style:normal;font-weight:700;font-size:16px;letter-spacing:.2em;padding:6px 12px;border-radius:999px;background:var(--green);color:var(--bg)}
.clock{text-align:right}
.clock .h{font-size:34px;font-weight:500;line-height:1}
.clock .d{font-size:16px;color:var(--mute);margin-top:4px}

#hero{position:relative;height:420px;border-radius:28px;background:var(--card);border:1px solid var(--line);overflow:hidden;flex:none}
#heroText{position:relative;z-index:2;height:100%;max-width:1000px;padding:0 72px;display:flex;flex-direction:column;justify-content:center;gap:22px}
#heroKind{font-size:18px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
#heroName{margin:0;font-weight:700;font-size:92px;line-height:.95;letter-spacing:-.02em}
#heroDesc{margin:0;font-size:28px;color:var(--soft);line-height:1.35}
#heroHint{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:22px;color:var(--mute)}
#heroHint span{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:600}
#heroArt{position:absolute;right:0;top:0;width:860px;height:420px}
#heroArt img.photo{width:860px;height:420px;object-fit:cover;object-position:center 38%;display:block}
#heroArt .fade{position:absolute;inset:0;background:linear-gradient(90deg,#151F1A 0%,rgba(21,31,26,.75) 22%,rgba(21,31,26,0) 55%)}
#heroArt .rings{position:absolute;right:-40px;top:-170px;width:760px;height:760px;display:flex;align-items:center;justify-content:center}
#heroArt .rings svg{position:absolute;inset:0}
#heroArt .rings .mono{position:relative;font-weight:700;font-size:300px;letter-spacing:-.04em;line-height:1}
#heroArt .rings img{position:relative;width:420px;height:236px;object-fit:cover;border-radius:24px}

h2{margin:0;font-size:26px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:18px;flex:none}
#main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.tile{height:190px;padding:0 36px;border-radius:24px;display:flex;align-items:center;gap:28px;background:var(--card);border:1px solid var(--line);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.tile.on{background:var(--card2);border-color:transparent;box-shadow:0 0 0 4px var(--text);transform:scale(1.03)}
.tile .logo{flex:none;width:200px;height:112px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#101813}
.tile .logo img{width:100%;height:100%;object-fit:cover}
.tile .logo img.sq{width:88px;height:88px;object-fit:contain}
.tile .logo .mono{font-weight:700;font-size:72px;letter-spacing:-.03em;line-height:1}
.tile .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .n{font-size:30px;font-weight:600;line-height:1.15}
.tile .k{font-size:19px;font-weight:500;color:var(--mute)}
.tile.off .logo,.tile.off .n{opacity:.55}

#short{display:flex;gap:20px;align-items:center;overflow:hidden;padding:6px;margin:-6px}
.sc{flex:none;height:80px;padding:0 30px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:500;display:flex;align-items:center;gap:16px;white-space:nowrap;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.sc.add{border:2px dashed var(--line2);background:transparent;color:var(--soft)}
.sc.on{background:var(--card2);border-color:transparent;box-shadow:0 0 0 4px var(--text);transform:scale(1.04);color:var(--text)}
.sc.off{color:var(--dim)}
.sc img{width:40px;height:40px;object-fit:contain;border-radius:8px}
.sc img.bn{width:64px;height:36px;object-fit:cover;border-radius:6px}
.sc svg{flex:none}

.veil{position:absolute;inset:0;z-index:10;background:rgba(8,12,10,.92);display:none;flex-direction:column;padding:72px 96px;gap:28px}
.veil.show{display:flex}
.veil h3{margin:0;font-size:44px;font-weight:700}
.veil p{margin:0;font-size:22px;color:var(--mute)}
#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px;overflow:hidden;padding:8px;margin:-8px;align-content:start;flex:1 1 auto}
.cell{height:190px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;position:relative;transition:transform .16s ease,box-shadow .16s ease}
.cell.on{background:var(--card2);border-color:transparent;box-shadow:0 0 0 4px var(--text);transform:scale(1.04)}
.cell img{width:176px;height:99px;object-fit:cover;border-radius:10px}
.cell img.sq{width:84px;height:84px;object-fit:contain}
.cell .l{font-size:19px;font-weight:500;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .pin{position:absolute;top:12px;right:12px;height:30px;padding:0 12px;border-radius:999px;background:var(--green);color:var(--bg);font-size:15px;font-weight:600;display:flex;align-items:center}
#ask{align-items:center;justify-content:center}
#ask .box{width:1100px;display:flex;flex-direction:column;gap:24px}
#ask input{height:88px;border-radius:18px;border:3px solid var(--text);background:var(--card);color:var(--text);font:500 32px Inter,sans-serif;padding:0 28px;outline:none;width:100%}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:20;background:var(--text);color:var(--bg);font-size:22px;font-weight:600;padding:16px 28px;border-radius:16px;opacity:0;transition:opacity .2s ease;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="root" style="position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden">
<div id="stage">
  <header>
    <div class="brand g"><b>DYNA</b><i>TV</i></div>
    <div class="clock"><div class="h g" id="hh">--:--</div><div class="d" id="dd"></div></div>
  </header>

  <section id="hero">
    <div id="heroText">
      <div id="heroKind"></div>
      <h1 id="heroName" class="g"></h1>
      <p id="heroDesc"></p>
      <div id="heroHint"><span>OK</span><em id="heroAct" style="font-style:normal">pour ouvrir</em></div>
    </div>
    <div id="heroArt"></div>
  </section>

  <section class="sec">
    <h2>Mes applis</h2>
    <div id="main"></div>
  </section>

  <section class="sec">
    <div id="short"></div>
  </section>

  <div class="veil" id="picker">
    <h3 class="g">Ajouter une appli</h3>
    <p>OK pour ajouter ou retirer de la barre du bas. Retour pour fermer.</p>
    <div id="grid"></div>
  </div>

  <div class="veil" id="ask">
    <div class="box">
      <h3 class="g">Adresse de Dynamusique</h3>
      <p>L'adresse affichée par Dynamusique sur le PC, par exemple http://100.x.x.x:8797. Valide avec OK, Retour pour annuler.</p>
      <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://">
    </div>
  </div>

  <div id="toast"></div>
</div>
</div>

<script>
(function () {
  'use strict';
  var B = window.Dyna || null;

  // ---------- Réglages ----------
  var MAIN = [
    { id: 'frtv', pkgs: ['tv.frigorose.app'], re: /^frigo ros[ée] tv$/i, mono: 'FR', name: 'Frigo Rosé TV', kind: 'Télé en direct', desc: 'Nos chaînes 24h/24, rien qu\'à nous.', tint: '#9CCB8F' },
    { id: 'iptv', pkgs: ['tv.frigorose.iptv'], re: /frigo ros[ée] iptv/i, mono: 'IP', name: 'Frigo Rosé IPTV', kind: 'IPTV', desc: 'Le direct, les films et les séries.', tint: '#E3CFA4' },
    { id: 'musique', web: 'dyna.musique', mono: 'Dm', name: 'Dynamusique', kind: 'Musique', desc: 'Notre musique, nos playlists.', tint: '#7FCFB5' }
  ];
  var SHORT = [
    { id: 'yt', pkgs: ['org.smarttube.stable', 'org.smarttube.beta', 'com.teamsmart.videomanager.tv', 'com.liskovsoft.smarttubetv.beta'], re: /smarttube/i, name: 'YouTube sans pub', icon: 'play' },
    { id: 'dl', pkgs: ['com.esaba.downloader'], re: /^downloader/i, name: 'Downloader', icon: 'down' },
    { id: 'ts', pkgs: ['com.tailscale.ipn'], re: /^tailscale$/i, name: 'Tailscale', icon: 'shield' }
  ];
  var ICONS = {
    play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/>',
    down: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',
    shield: '<path d="M12 3l7 3v5c0 4.500-3 8.200-7 10-4-1.800-7-5.500-7-10V6z"/><path d="M9 12l2.200 2.200L15 10"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    note: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'
  };
  function svg(name) {
    return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  // ---------- Mémoire ----------
  function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

  // ---------- État ----------
  var apps = [];            // applis installées sur la box
  var pins = get('dyna.pins', []);
  var zone = 'main';        // main | short | picker | ask
  var idx = { main: 0, short: 0, picker: 0 };
  var shortItems = [];
  var pickItems = [];
  var hasPhoto = false;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function loadApps() {
    if (!B) {
      apps = [
        { pkg: 'tv.frigorose.app', label: 'Frigo Rosé TV', banner: false },
        { pkg: 'com.esaba.downloader', label: 'Downloader', banner: false },
        { pkg: 'com.example.autre', label: 'Autre appli', banner: false }
      ];
      return;
    }
    try { apps = JSON.parse(B.installed()) || []; } catch (e) { apps = []; }
    apps.sort(function (a, b) { return a.label.localeCompare(b.label); });
  }
  function find(def) {
    var i, j;
    if (def.pkgs) for (i = 0; i < def.pkgs.length; i++) for (j = 0; j < apps.length; j++) if (apps[j].pkg === def.pkgs[i]) return apps[j];
    if (def.re) for (j = 0; j < apps.length; j++) if (def.re.test(apps[j].label)) return apps[j];
    return null;
  }
  function byPkg(p) { for (var j = 0; j < apps.length; j++) if (apps[j].pkg === p) return apps[j]; return null; }
  function logo(app, cls) {
    return '<img alt="" onerror="this.style.visibility=\'hidden\'" class="' + (app.banner ? (cls || '') : 'sq') + '" src="icon/' + encodeURIComponent(app.pkg) + '">';
  }

  // ---------- Affichage ----------
  function renderMain() {
    var h = '';
    MAIN.forEach(function (d, i) {
      var app = d.web ? null : find(d);
      d.app = app;
      d.ready = d.web ? !!get(d.web, '') : !!app;
      var art = app ? logo(app) : '<span class="mono g" style="color:' + d.tint + '">' + d.mono + '</span>';
      var sub = d.kind + (d.ready ? '' : (d.web ? ' · à régler' : ' · pas installée'));
      h += '<div class="tile' + (zone === 'main' && idx.main === i ? ' on' : '') + (d.ready ? '' : ' off') + '">' +
        '<div class="logo">' + art + '</div><div class="t"><div class="n">' + esc(d.name) + '</div><div class="k">' + esc(sub) + '</div></div></div>';
    });
    $('main').innerHTML = h;
  }
  function buildShort() {
    shortItems = [];
    SHORT.forEach(function (d) { shortItems.push({ type: 'app', name: d.name, icon: d.icon, app: find(d) }); });
    pins.forEach(function (p) { var a = byPkg(p); if (a) shortItems.push({ type: 'app', name: a.label, app: a, pinned: true }); });
    shortItems.push({ type: 'settings', name: 'Paramètres', icon: 'gear' });
    shortItems.push({ type: 'add', name: 'Ajouter une appli', icon: 'plus' });
    if (idx.short >= shortItems.length) idx.short = shortItems.length - 1;
  }
  function renderShort() {
    var h = '';
    shortItems.forEach(function (s, i) {
      var cls = 'sc' + (s.type === 'add' ? ' add' : '') + (zone === 'short' && idx.short === i ? ' on' : '') + (s.type === 'app' && !s.app ? ' off' : '');
      var ic = s.app ? '<img alt="" onerror="this.style.visibility=\'hidden\'" class="' + (s.app.banner ? 'bn' : '') + '" src="icon/' + encodeURIComponent(s.app.pkg) + '">' : svg(s.icon || 'plus');
      h += '<div class="' + cls + '">' + ic + '<span>' + esc(s.name) + '</span></div>';
    });
    $('short').innerHTML = h;
    var box = $('short'), on = box.querySelector('.on');
    if (on) {
      var l = on.offsetLeft - box.offsetLeft, r = l + on.offsetWidth;
      if (l < box.scrollLeft) box.scrollLeft = l - 6;
      else if (r > box.scrollLeft + box.clientWidth) box.scrollLeft = r - box.clientWidth + 6;
    } else box.scrollLeft = 0;
    noScroll();
  }
  function renderHero() {
    var d = MAIN[idx.main];
    $('heroKind').textContent = d.kind;
    $('heroKind').style.color = d.tint;
    $('heroName').textContent = d.name;
    $('heroDesc').textContent = d.desc;
    $('heroAct').textContent = d.ready ? 'pour ouvrir' : (d.web ? 'pour régler l\'adresse' : 'pas encore installée sur la box');
    var art = $('heroArt');
    if (hasPhoto) {
      if (!art.querySelector('.photo')) art.innerHTML = '<img class="photo" alt="" src="photo.jpg"><div class="fade"></div>';
      return;
    }
    var inner = d.app && d.app.banner ? logo(d.app) : '<span class="mono g" style="color:' + d.tint + '">' + d.mono + '</span>';
    art.innerHTML = '<div class="rings"><svg width="760" height="760" viewBox="0 0 760 760" aria-hidden="true">' +
      '<circle cx="380" cy="380" r="370" fill="none" stroke="#1E2B24" stroke-width="2"/>' +
      '<circle cx="380" cy="380" r="290" fill="none" stroke="#24332B" stroke-width="2"/>' +
      '<circle cx="380" cy="380" r="210" fill="none" stroke="#2B3C32" stroke-width="2"/></svg>' + inner + '</div>';
  }
  function buildPicker() {
    var fixed = {};
    MAIN.forEach(function (d) { if (d.app) fixed[d.app.pkg] = 1; });
    SHORT.forEach(function (d) { var a = find(d); if (a) fixed[a.pkg] = 1; });
    pickItems = [{ special: 'musique', label: 'Adresse de Dynamusique' }];
    apps.forEach(function (a) { if (!fixed[a.pkg]) pickItems.push(a); });
    if (idx.picker >= pickItems.length) idx.picker = pickItems.length - 1;
  }
  function renderPicker() {
    var h = '';
    pickItems.forEach(function (a, i) {
      var on = zone === 'picker' && idx.picker === i ? ' on' : '';
      if (a.special) {
        h += '<div class="cell' + on + '" style="color:#7FCFB5">' + svg('note').replace('width="28" height="28"', 'width="64" height="64"') + '<div class="l" style="color:#EFE8DA">' + esc(a.label) + '</div></div>';
      } else {
        h += '<div class="cell' + on + '">' + (pins.indexOf(a.pkg) >= 0 ? '<div class="pin">Ajoutée</div>' : '') + logo(a) + '<div class="l">' + esc(a.label) + '</div></div>';
      }
    });
    $('grid').innerHTML = h;
    var g = $('grid'), el = g.querySelector('.on');
    if (el) {
      var t = el.offsetTop - g.offsetTop, b = t + el.offsetHeight;
      if (t < g.scrollTop) g.scrollTop = t - 8;
      else if (b > g.scrollTop + g.clientHeight) g.scrollTop = b - g.clientHeight + 8;
    }
    noScroll();
  }
  function render() {
    renderMain(); buildShort(); renderShort(); renderHero();
    if (zone === 'picker') { buildPicker(); renderPicker(); }
  }

  var toastT = 0;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.className = 'show';
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, 3200);
  }

  // ---------- Actions ----------
  function openAsk() {
    zone = 'ask';
    $('ask').className = 'veil show';
    var inp = $('url'); inp.value = get('dyna.musique', '') || 'http://';
    setTimeout(function () { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) { } }, 50);
  }
  function closeAsk(save) {
    var inp = $('url');
    if (save) {
      var v = inp.value.replace(/\s+/g, '');
      if (v && v !== 'http://' && !/^https?:\/\//i.test(v)) v = 'http://' + v;
      if (v === 'http://') v = '';
      set('dyna.musique', v);
      toast(v ? 'Adresse de Dynamusique enregistrée' : 'Adresse effacée');
    }
    inp.blur();
    $('ask').className = 'veil';
    zone = $('picker').className.indexOf('show') >= 0 ? 'picker' : 'main';
    render();
  }
  function openPicker() { zone = 'picker'; idx.picker = 0; $('picker').className = 'veil show'; buildPicker(); renderPicker(); }
  function closePicker() { $('picker').className = 'veil'; zone = 'short'; render(); }

  function launch(app, name) {
    if (!app) { toast(name + ' n\'est pas encore installée sur la box'); return; }
    if (!B) { toast('Ouverture de ' + name); return; }
    if (!B.launch(app.pkg)) toast('Impossible d\'ouvrir ' + name);
  }
  function ok() {
    if (zone === 'main') {
      var d = MAIN[idx.main];
      if (d.web) {
        var u = get(d.web, '');
        if (!u) return openAsk();
        if (B) B.openPage(u, 'musique.html'); else toast('Ouverture de ' + u);
        return;
      }
      return launch(d.app, d.name);
    }
    if (zone === 'short') {
      var s = shortItems[idx.short];
      if (s.type === 'add') return openPicker();
      if (s.type === 'settings') { if (B) B.openSettings(); else toast('Paramètres'); return; }
      return launch(s.app, s.name);
    }
    if (zone === 'picker') {
      var a = pickItems[idx.picker];
      if (!a) return;
      if (a.special) return openAsk();
      var p = pins.indexOf(a.pkg);
      if (p >= 0) pins.splice(p, 1); else pins.push(a.pkg);
      set('dyna.pins', pins);
      renderPicker();
    }
  }
  function move(dx, dy) {
    if (zone === 'main') {
      if (dy > 0) { zone = 'short'; }
      else if (dx) idx.main = Math.max(0, Math.min(MAIN.length - 1, idx.main + dx));
    } else if (zone === 'short') {
      if (dy < 0) { zone = 'main'; }
      else if (dx) idx.short = Math.max(0, Math.min(shortItems.length - 1, idx.short + dx));
    } else if (zone === 'picker') {
      var n = idx.picker + dx + dy * 6;
      if (n >= 0 && n < pickItems.length) idx.picker = n;
      else if (dy > 0) idx.picker = pickItems.length - 1;
      return renderPicker();
    }
    render();
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key, c = e.keyCode;
    if (zone === 'ask') {
      if (k === 'Enter' || c === 13) { e.preventDefault(); closeAsk(true); }
      else if (k === 'Escape') { e.preventDefault(); closeAsk(false); }
      return;
    }
    if (k === 'ArrowLeft' || c === 37) move(-1, 0);
    else if (k === 'ArrowRight' || c === 39) move(1, 0);
    else if (k === 'ArrowUp' || c === 38) move(0, -1);
    else if (k === 'ArrowDown' || c === 40) move(0, 1);
    else if (k === 'Enter' || c === 13 || c === 23) ok();
    else if (k === 'Escape' || k === 'Backspace') back();
    else return;
    e.preventDefault();
  });

  function back() {
    if (zone === 'ask') return closeAsk(false);
    if (zone === 'picker') return closePicker();
    if (zone === 'short') { zone = 'main'; render(); }
  }
  window.dynaBack = back;
  window.dynaHome = function () {
    if (zone === 'ask') closeAsk(false);
    if (zone === 'picker') $('picker').className = 'veil';
    zone = 'main'; idx.main = 0; render();
  };
  window.dynaRefresh = function () { loadApps(); render(); };

  // ---------- Heure ----------
  var J = ['Dim.', 'Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.'];
  var M = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('hh').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    $('dd').textContent = J[d.getDay()] + ' ' + d.getDate() + ' ' + M[d.getMonth()];
  }

  // ---------- Démarrage ----------
  // La page ne doit jamais défiler : seul l'écran 1920×1080 réduit à la taille de la télé est visible
  function noScroll() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = document.documentElement.scrollLeft = 0;
    document.body.scrollTop = document.body.scrollLeft = 0;
    $('root').scrollTop = $('root').scrollLeft = 0;
  }
  function fit() {
    var w = (B && B.screenW && B.screenW()) || document.documentElement.clientWidth || window.innerWidth;
    var h = (B && B.screenH && B.screenH()) || document.documentElement.clientHeight || window.innerHeight;
    var s = Math.min(w / 1920, h / 1080);
    $('stage').style.transform = 'scale(' + s + ')';
    $('stage').style.left = Math.max(0, (w - 1920 * s) / 2) + 'px';
    $('stage').style.top = Math.max(0, (h - 1080 * s) / 2) + 'px';
    noScroll();
  }
  window.addEventListener('scroll', noScroll);
  setTimeout(fit, 300); setTimeout(fit, 1200);
  window.addEventListener('resize', fit);
  fit(); tick(); setInterval(tick, 15000);
  loadApps(); render();
  var ph = new Image();
  ph.onload = function () { hasPhoto = true; renderHero(); };
  ph.src = 'photo.jpg';
})();
</script>
</body>
</html>
